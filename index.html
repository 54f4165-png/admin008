<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XOAIP ADMIN | Bảo mật nâng cao</title><style>:root{color-scheme:dark;--g:#00f5ae;--c:#00cbbb;--bg:#001315}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#073b32,#001012 65%);font:14px/1.5 Inter,system-ui,'Segoe UI',Arial,sans-serif;color:#e3fff8}.wrap{max-width:950px;margin:30px auto;padding:16px}.panel{border:1px solid #087c72;background:#001b1c;padding:22px;margin-bottom:18px;border-radius:8px}h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px}h2{font-size:18px;margin:0 0 16px}p,small{color:#9ec6bf}.row{display:flex;gap:10px;flex-wrap:wrap}input{background:#001012;color:white;border:1px solid #18766c;border-radius:5px;padding:13px;font:inherit;min-width:0;flex:1}button{background:var(--g);color:#002820;border:0;border-radius:5px;font-weight:800;padding:12px 18px;cursor:pointer}button.secondary{background:#063e38;color:#bfffee;border:1px solid #0eaa8e}button.danger{background:#451c28;color:#ffc6d2;border:1px solid #b94b61}button:disabled{opacity:.5;cursor:not-allowed}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-bottom:1px solid #16433e;overflow-wrap:anywhere}.item strong{color:var(--g)}#msg{min-height:24px;color:#8effd4}#admin{display:none}.meta{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;align-items:center}@media(max-width:540px){.wrap{margin:6px auto;padding:10px}.panel{padding:15px}.row input{flex-basis:100%}}</style></head><body><main class="wrap"><section class="panel"><div class="meta"><div><h1>XOAIP ADMIN</h1><p>Quản lý danh sách tài khoản USER</p></div><strong style="color:var(--g)">SECURE ADMIN · AUTH REQUIRED</strong></div></section><section id="login" class="panel"><h2>ĐĂNG NHẬP QUẢN TRỊ</h2><form id="loginForm" class="row"><input id="email" value="td@gmail.com" type="email" autocomplete="username" placeholder="Email ADMIN" required><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required><button>ĐĂNG NHẬP</button></form><div class="row" style="margin-top:12px"><button type="button" class="secondary" id="resetPassword">QUÊN MẬT KHẨU</button><button type="button" class="secondary" id="verifyEmail" hidden>GỬI EMAIL XÁC MINH</button></div><small>Chỉ tài khoản được cấp quyền trong Firebase mới có thể quản lý dữ liệu. Không lưu mật khẩu trong mã HTML.</small></section><section id="admin"><section class="panel"><div class="meta"><h2>QUẢN LÝ TÀI KHOẢN</h2><button class="secondary" id="logout">ĐĂNG XUẤT</button></div><small id="uid"></small><form id="addForm" class="row" style="margin-top:14px"><input id="username" placeholder="Nhập tên tài khoản USER" maxlength="80" required><button>+ THÊM TÀI KHOẢN</button></form></section><section class="panel"><h2>DANH SÁCH ĐƯỢC PHÊ DUYỆT <span id="count">(0)</span></h2><input id="search" placeholder="Tìm tài khoản..." style="width:100%;margin-bottom:10px"><div id="list"></div></section></section><section class="panel"><div id="msg" role="status" aria-live="polite">Đang kết nối Firebase…</div></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,sendPasswordResetEmail,sendEmailVerification,setPersistence,browserSessionPersistence} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,get,onValue,set,remove} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
// Firebase Web configuration is public by design; authorization is enforced by Database Rules.
const firebaseConfig={"apiKey":"AIzaSyAsXY9e2jDYnuuisfopPnaNZ8cl982aj1Q","authDomain":"admin008-75abc.firebaseapp.com","databaseURL":"https://admin008-75abc-default-rtdb.asia-southeast1.firebasedatabase.app","projectId":"admin008-75abc","storageBucket":"admin008-75abc.firebasestorage.app","messagingSenderId":"330786436608","appId":"1:330786436608:web:8527809f313eecbfa1cae5","measurementId":"G-0YKEDXH72E"};
// Không lưu tài khoản/mật khẩu ADMIN trong file HTML.
const $=id=>document.getElementById(id),msg=s=>$('msg').textContent=s;
let unsubscribe=null,entries=[];
const explainError=e=>({
'auth/too-many-requests':'Firebase đang tạm khóa vì có quá nhiều yêu cầu. Dừng thử đăng nhập/gửi email; chờ Firebase gỡ giới hạn rồi thử lại.',
'auth/invalid-credential':'Email hoặc mật khẩu chưa đúng. Kiểm tra trong Firebase Authentication; có thể dùng Quên mật khẩu.',
'auth/invalid-email':'Địa chỉ email không hợp lệ.',
'auth/network-request-failed':'Không kết nối được máy chủ xác thực. Kiểm tra mạng và thử lại.',
'auth/user-disabled':'Tài khoản đã bị vô hiệu hóa trong Firebase Authentication.',
'auth/unauthorized-domain':'Tên miền chưa được cho phép trong Authentication → Settings → Authorized domains.',
'auth/operation-not-allowed':'Chưa bật Email/Password trong Authentication → Sign-in method.'
})[e?.code]||('Firebase: '+(e?.code||e?.message||'Lỗi không xác định'));
let authBusy=false;
const normalized=s=>s.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'_');
let auth,db;
try{if(!firebaseConfig.appId)throw Error('Chưa cấu hình appId. Xem HUONG_DAN.txt');const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);setPersistence(auth,browserSessionPersistence).catch(()=>msg('Không thể bật phiên đăng nhập tạm thời'));
$('resetPassword').onclick=async()=>{const email=$('email').value.trim();if(!email){msg('Nhập email ADMIN trước khi đặt lại mật khẩu');return}try{await sendPasswordResetEmail(auth,email);msg('Nếu email tồn tại, liên kết đặt lại mật khẩu đã được gửi.')}catch(e){msg(explainError(e))}};
$('verifyEmail').onclick=async()=>{if(!auth.currentUser)return;try{await sendEmailVerification(auth.currentUser);msg('Đã gửi email xác minh. Hãy xác minh, đăng xuất rồi đăng nhập lại.')}catch(e){msg(explainError(e))}};
$('loginForm').addEventListener('submit',async e=>{
 e.preventDefault();if(authBusy)return;
 const email=$('email').value.trim(),password=$('password').value;
 if(!email||!password){msg('Nhập email và mật khẩu Firebase Authentication.');return}
 authBusy=true;const submit=$('loginForm').querySelector('button[type=submit],button:not([type])');
 if(submit)submit.disabled=true;
 try{await signInWithEmailAndPassword(auth,email,password);$('password').value='';}
 catch(err){msg(explainError(err));}
 finally{authBusy=false;if(submit)submit.disabled=false;}
});
$('logout').onclick=()=>signOut(auth);
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const name=$('username').value.trim(),id=normalized(name);if(!name||!id||!/^[a-z0-9_-]+$/.test(name.toLowerCase())){msg('Tên tài khoản không hợp lệ');return}try{await set(ref(db,'approvedUsers/'+id),{username:name,approved:true});$('username').value='';msg('Đã thêm '+name)}catch(err){msg('Không thể thêm: '+err.message)}});
$('search').addEventListener('input',render);
function render(){const q=$('search').value.toLowerCase();const visible=entries.filter(([id,v])=>(v.username||id).toLowerCase().includes(q));$('list').replaceChildren();$('count').textContent='('+entries.length+')';for(const [id,v] of visible){const item=document.createElement('div');item.className='item';const name=document.createElement('strong');name.textContent=v.username||id;const del=document.createElement('button');del.className='danger';del.textContent='XÓA';del.onclick=async()=>{if(!confirm('Xóa '+(v.username||id)+'?'))return;try{await remove(ref(db,'approvedUsers/'+id));msg('Đã xóa '+id)}catch(e){msg('Không thể xóa: '+e.message)}};item.append(name,del);$('list').append(item)}}
onAuthStateChanged(auth,async user=>{if(unsubscribe){unsubscribe();unsubscribe=null}entries=[];render();$('admin').style.display='none';$('login').style.display='block';$('verifyEmail').hidden=true;if(!user){msg('Vui lòng đăng nhập');return}if(!user.emailVerified){$('verifyEmail').hidden=false;msg('Email chưa xác minh. Hãy kiểm tra hộp thư hoặc gửi email xác minh một lần; nếu Firebase giới hạn yêu cầu, hãy chờ trước khi thử lại.');return}try{const snap=await get(ref(db,'adminUids/'+user.uid));if(snap.val()!==true){msg('Tài khoản không có quyền ADMIN. UID: '+user.uid);return}$('uid').textContent='ADMIN UID: '+user.uid;$('login').style.display='none';$('admin').style.display='block';msg('Đã xác thực quản trị viên');unsubscribe=onValue(ref(db,'approvedUsers'),snap=>{entries=Object.entries(snap.val()||{}).filter(([,v])=>v?.approved===true);render()},err=>msg('Lỗi đọc danh sách: '+err.message))}catch(err){msg('Không xác thực được quyền ADMIN: '+err.message)}});
}catch(err){msg('Lỗi cấu hình Firebase: '+err.message)}
</script></body></html>
