<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XOAIP ADMIN v2.0</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#07372f,#001012 75%);color:#dcfff6;font:14px Consolas,monospace}.wrap{max-width:950px;margin:25px auto;padding:14px}.panel{border:1px solid #00e8d3;background:#00191c;padding:22px;margin-bottom:15px}h1{font-size:23px;color:#00e8d3;margin:0 0 8px}h2{font-size:17px;color:#00ffa2}input{background:#001016;border:1px solid #39776c;color:white;padding:13px;border-radius:3px;min-width:0;flex:1}button{background:#005d41;color:#e4fff5;border:1px solid #00ffa2;padding:12px 18px;cursor:pointer}button:hover{background:#087655}button:disabled{opacity:.5;cursor:wait}.line{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.line>*{flex:1}#message{min-height:22px;color:#ff7186}.user{border-bottom:1px solid #17403d;padding:12px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}.user button{background:#451621;border-color:#ff4765;flex:0}small{color:#8fc8bb}#management{display:none}#logout{float:right}a{color:#00e8d3}@media(max-width:500px){.line{flex-direction:column}.user{flex-wrap:wrap}}.panel{border-radius:8px}button{border-radius:5px}input{font:inherit}body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}#users{max-height:520px;overflow:auto}#management{display:none;grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr);gap:12px;align-items:start}#management>.panel{margin:0}#xoaip-chat-admin-root{grid-column:1;grid-row:1}#account-panel{grid-column:2;grid-row:1}#management .xc-admin{grid-template-columns:minmax(145px,210px) minmax(0,1fr)}#management .xc-rooms{max-height:540px}#management .xc-admin .xc-log{height:370px}#account-panel .line{flex-wrap:wrap}#account-panel #addForm>*{flex-basis:100%}#account-panel #users{max-height:430px}@media(max-width:1100px){#management{grid-template-columns:1fr}#xoaip-chat-admin-root,#account-panel{grid-column:1;grid-row:auto}}@media(max-width:650px){#management .xc-admin{grid-template-columns:1fr}}.wrap{max-width:1500px}#xoaip-chat-admin-root h2{margin-top:0}</style></head><body><main class="wrap"><section class="panel"><h1>◉ XOAIP ADMIN v2.0</h1><small>USER MANAGEMENT · FIREBASE REALTIME DATABASE</small></section><section class="panel" id="login"><h2>ĐĂNG NHẬP ADMIN</h2><form id="loginForm"><div class="line"><input id="email" type="email" autocomplete="username" placeholder="Email ADMIN" required><input id="password" type="password" autocomplete="current-password" placeholder="Mật khẩu" required></div><button type="submit">ĐĂNG NHẬP</button></form></section><section id="management"><section class="panel" id="xoaip-chat-admin-root" hidden></section><div class="panel" id="account-panel"><button id="logout">ĐĂNG XUẤT</button><h2>TRANG USER · DANH SÁCH ĐƯỢC DUYỆT</h2><p><small id="userCount">Đang đồng bộ...</small></p><small id="adminInfo"></small><form id="addForm" class="line"><input id="username" placeholder="Nhập tên tài khoản game..." required maxlength="80"><button type="submit">+ THÊM USER</button></form><div class="line"><input id="userSearch" placeholder="🔎 Tìm tài khoản đã duyệt..." aria-label="Tìm tài khoản"></div><div id="users">Đang tải dữ liệu...</div></div></section><section class="panel"><div id="message" role="status"></div><small>Danh sách này chỉ quản lý quyền sử dụng. Không phải kết quả kiểm tra bảo mật hoặc xác nhận đã xóa mã thực tế.</small></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,onValue,set,remove} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const config={apiKey:'AIzaSyAsXY9e2jDYnuuisfopPnaNZ8cl982aj1Q',authDomain:'admin008-75abc.firebaseapp.com',databaseURL:'https://admin008-75abc-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'admin008-75abc',storageBucket:'admin008-75abc.firebasestorage.app',messagingSenderId:'330786436608',appId:'1:330786436608:web:8527809f313eecbfa1cae5',measurementId:''};
const app=initializeApp(config);const auth=getAuth(app);const db=getDatabase(app);const adminUID=null; // Quyền ADMIN được kiểm tra động qua adminUids/<auth.uid>.
export {auth,db,ref,onValue,set,remove,signInWithEmailAndPassword,signOut,onAuthStateChanged,adminUID};
export function normalizeName(s){return s.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'_')}
export function watchApproval(name,callback){return onValue(ref(db,'approvedUsers/'+normalizeName(name)),s=>callback({connected:true,approved:s.exists()&&s.val()?.approved===true}),e=>callback({connected:false,approved:false,error:e.message}))}

const $=id=>document.getElementById(id);let unsubscribe=null;let refreshUsers=()=>{};$('userSearch').addEventListener('input',()=>refreshUsers());const msg=t=>$('message').textContent=t;
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);$('password').value=''}catch(err){msg('Không thể đăng nhập: '+err.code)}});
$('logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{if(unsubscribe){unsubscribe();unsubscribe=null}const allowed=!!user;$('login').style.display=allowed?'none':'block';$('management').style.display='none';$('xoaip-chat-admin-root').hidden=true;if(user&&!allowed){msg('Tài khoản này không có quyền ADMIN.');return}if(!allowed)return;msg('Đang kiểm tra quyền ADMIN...');$('adminInfo').textContent='UID: '+user.uid;unsubscribe=onValue(ref(db,'adminUids/'+user.uid),grant=>{if(grant.val()!==true){$('management').style.display='none';$('xoaip-chat-admin-root').hidden=true;$('login').style.display='block';msg('UID chưa được cấp quyền trong adminUids.');return;}$('login').style.display='none';$('management').style.display='grid';$('xoaip-chat-admin-root').hidden=false;msg('Đã xác thực ADMIN.');onValue(ref(db,'approvedUsers'),snapshot=>{const data=snapshot.val()||{};const list=$('users');list.replaceChildren();refreshUsers=()=>{const entries=Object.entries(data).filter(([k,v])=>v?.approved===true).sort(([a],[b])=>a.localeCompare(b));$('userCount').textContent='TỔNG USER: '+entries.length+' · ĐỒNG BỘ TRỰC TIẾP';if(!entries.length){list.textContent='Chưa có USER được duyệt.';return}for(const [id,entry] of entries){if(!((entry.username||id).toLowerCase().includes(($('userSearch').value||'').toLowerCase().trim())))continue;const row=document.createElement('div');row.className='user';const label=document.createElement('span');label.textContent=entry.username||id;const del=document.createElement('button');del.textContent='XÓA';del.onclick=async()=>{if(!confirm('Thu hồi quyền của '+(entry.username||id)+'?'))return;try{await remove(ref(db,'approvedUsers/'+id));msg('Đã thu hồi quyền: '+id)}catch(e){msg('Lỗi: '+e.message)}};row.append(label,del);list.append(row)}};refreshUsers()},e=>msg('Không thể đọc dữ liệu: '+e.message))},e=>msg('Không thể kiểm tra quyền: '+e.message))});
$('addForm').addEventListener('submit',async e=>{e.preventDefault();const username=$('username').value.trim(),id=normalizeName(username);if(!id||!/[a-z0-9]/.test(id)){msg('Tên tài khoản không hợp lệ.');return}try{await set(ref(db,'approvedUsers/'+id),{username,approved:true});$('username').value='';msg('Đã thêm USER: '+username)}catch(err){msg('Không thể thêm USER: '+err.message)}});
</script><script type="module" src="./xoaip-chat.js"></script></body></html>
